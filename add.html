<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>افزودن تراکنش</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="main-header">
        <h1>➕ افزودن تراکنش جدید</h1>
    </header>
    <div class="form-container">
        <!-- form tarakonesh -->
         <form id="transaction-form">
            <label for="transaction-title">عنوان</label>
            <input type="text" id="transaction-title" placeholder="هزینه">
            <label for="transaction-amount">مبلغ</label>
            <input type="number" id="transaction-amount" placeholder="مبلغ">
            <!-- نوع ترکنش -->
             <label for="transaction-type"> نوع تراکنش</label>
             <select id="transaction-type">
                 <option value="income">درامد</option>
                 <option value="expense">هزینه</option>
             </select>
             <!-- دکمه ذخیره -->
              <button type="submit" id="save-btn">ذخیره</button>
         </form>
         <!-- بازگشت به داشبورد -->
          <a href="index.html" class="btn btn-secondary">بازگشت به داشبورد🏠</a>
    </div>
    <script src="js/add.js"></script>
</body>
</html>
